const ST={upcoming:['hourglass','Upcoming'],due:['bell','Due now'],taken:['check','Taken'],missed:['x','Missed'],skipped:['skip','Skipped'],snoozed:['snooze','Snoozed']};
let S,prev='live',view={};
function base(){return{dev:{name:'Sage Bot',tz:'Asia/Kolkata',snooze:10,missed:30,low:5,h24:true,sim:true,offline:false,notif:false},hw:{oled:1},meds:[],slots:Array.from({length:8},()=>({med:null,left:0})),sched:[],hist:[],doses:[],day:'',log:[],screen:{name:'boot',data:{}},alarmId:null,theme:''}}
function demo(){const meds=[{id:1,name:'Metformin',dose:'500mg',color:COLORS[0]},{id:2,name:'Vitamin D3',dose:'1000 IU',color:COLORS[1]},{id:3,name:'Amlodipine',dose:'5mg',color:COLORS[2]}];
 S.meds=meds;S.slots.forEach((s,i)=>{s.med=i<3?i+1:null;s.left=i<3?20:0});
 S.sched=['08:00','13:00','21:00'].map((t,i)=>({id:i+1,slot:i+1,time:t,days:[1,1,1,1,1,1,1],qty:1,on:1}));S.hist=[];
 for(let k=10;k>=1;k--){const d=new Date(Date.now()-k*864e5).toISOString().slice(0,10);S.sched.forEach(s=>{const ok=Math.random()<.9;S.hist.push({date:d,time:s.time,med:meds[s.slot-1].name,status:ok?'taken':'missed',via:ok?(Math.random()<.5?'button':'app'):'-'})})}S.day='';S.doses=[]}
/* ===== DATA LAYER =====
 Replace the bodies of these methods with Supabase calls later. The UI should go through api only. */
const api={
 load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S){S=base();demo()}},
 save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},
 async getState(){return S},async getHistory(){return S.hist},
 async saveSchedule(s){const i=S.sched.findIndex(x=>x.id===s.id);i<0?S.sched.push(s):S.sched[i]=s;S.day='';ensureDay();this.save()},
 async saveSlot(n,o){Object.assign(S.slots[n-1],o);this.save()},
 async updateHardware(k,v){S.hw[k]=v?1:0;this.save()},
 sendCommand(type,p={}){const c={id:Math.random(),type,p,status:'pending',res:'',t:new Date().toLocaleTimeString()};S.log.unshift(c);S.log.length=Math.min(S.log.length,20);
  return new Promise(res=>{const fin=(st,r)=>{c.status=st;c.res=r;if(st!=='failed')sim.apply(c);api.save();render();res(c)};
   if(S.dev.offline)setTimeout(()=>fin('failed','Device not responding'),20000);else setTimeout(()=>{const real=type==='rotate'||type==='home'?S.hw.stepper:1;fin(real?'done':'simulated',type==='test'?TESTS[p.part]:real?'OK':'Simulated (part off)')},1000+Math.random()*1000)});render()}};
/* ===== SIMULATOR ===== */
const sim={apply(c){const p=c.p;if(c.type==='home')S.pos=1;if(c.type==='rotate'){S.pos=p.slot;setScreen('moving',{slot:p.slot});setTimeout(()=>setScreen('home'),2500)}else if(c.type==='oled')setScreen(p.screen,p.data);else if(c.type==='test'&&p.part==='oled'){setScreen('message',{lines:['OLED test','All pixels OK','Sage Bot']});setTimeout(()=>setScreen('home'),4000)}}};
function setScreen(name,data={}){S.screen={name,data};render()}
function toMin(t){const[a,b]=t.split(':');return+a*60+ +b}
function nowTz(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:S.dev.tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short',month:'short'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
 const n=new Intl.DateTimeFormat('en-GB',{timeZone:S.dev.tz,month:'2-digit'}).format(new Date());const h=+p.hour%24,m=+p.minute;
 return{h,min:h*60+m,hm:String(h).padStart(2,'0')+':'+p.minute,date:p.year+'-'+n+'-'+p.day,dow:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),label:p.weekday+' '+p.day+' '+p.month}}
function ensureDay(){const n=nowTz(),old=S.doses||[];S.day=n.date;S.doses=S.sched.filter(s=>s.on&&s.days[n.dow]).sort((a,b)=>a.time<b.time?-1:1).map(s=>old.find(d=>d.sid===s.id&&d.time===s.time)||{id:s.id+'-'+s.time,sid:s.id,slot:s.slot,time:s.time,qty:s.qty,status:'upcoming'})}
function homeData(){const n=nowTz(),x=S.doses.find(d=>d.status==='upcoming');const m=x&&medAt(x.slot);return{time:n.hm,date:n.label,next:x&&m?`Next: ${m.name} ${x.time} S${x.slot}`:'No doses today'}}
function tick(){if(!S.dev.sim)return;if(S.day!==nowTz().date)ensureDay();const n=nowTz();let ch=0;
 S.doses.forEach(d=>{const t=toMin(d.time);if(d.status==='upcoming'&&n.min>=t&&n.min-t<S.dev.missed){d.status='due';d.dueAt=n.min;ch=1}else if(d.status==='upcoming'&&n.min-t>=S.dev.missed){close(d,'missed','-');ch=1}
  else if(d.status==='snoozed'&&n.min>=d.until){d.status='due';d.dueAt=n.min;ch=1}else if(d.status==='due'&&n.min-d.dueAt>=S.dev.missed){close(d,'missed','-');ch=1}});
 const cur=S.doses.find(d=>d.status==='due');
 if(cur&&S.alarmId!==cur.id){S.alarmId=cur.id;const m=medAt(cur.slot);setScreen('alarm',{med:m?m.name:'?',dose:m?m.dose:'',slot:cur.slot});toast('Dose due: '+(m?m.name:''));if(S.dev.notif&&window.Notification&&Notification.permission==='granted')new Notification('Sage Bot',{body:'Time for '+(m?m.name:'your medicine')})}
 if(!cur)S.alarmId=null;if(ch){api.save();render()}else if(view.route==='dashboard')paintOled()}
function close(d,status,via){d.status=status;S.hist.push({date:S.day,time:d.time,med:(medAt(d.slot)||{}).name||'?',status,via});
 if(status==='taken'){const sl=S.slots[d.slot-1];sl.left=Math.max(0,sl.left-d.qty);if(sl.left<=S.dev.low)toast('Low stock: '+(medAt(d.slot)||{}).name+' ('+sl.left+' left)')}
 const m=medAt(d.slot)||{name:'?'};if(status==='taken')setScreen('taken',{med:m.name});if(status==='missed')setScreen('missed',{med:m.name,time:d.time});
 if(status!=='due'){S.alarmId=null;setTimeout(()=>{if(!S.alarmId)setScreen('home')},4000)}}

function renderOled(cv,name,d){d=d||{};const x=cv.getContext('2d');x.fillStyle='#050607';x.fillRect(0,0,128,64);x.fillStyle='#dfe6ea';x.textBaseline='top';
 const T=(s,px,py,z,al)=>{s=String(s).toUpperCase();let k=z>=10?2:1;if(s.length*6*k>128)k=1;const w=s.length*6*k-k;let X=al==='center'?Math.round(px-w/2):al==='right'?px-w:px;for(const ch of s){const g=FONT[ch.charCodeAt(0)-32];if(g)for(let i=0;i<5;i++)for(let j=0;j<7;j++)if(g[i]>>j&1)x.fillRect(X+i*k,py+j*k,k,k);X+=6*k}};
 if(!S.hw.oled)T('OLED disabled',64,28,9,'center');else{const c=64;switch(name){

  case'alarm':T('TAKE MEDICINE',c,2,9,'center');T(d.med||'',c,18,12,'center');T((d.dose||'')+'  Slot '+d.slot,c,36,8,'center');T(S.hw.button?'Press button':'Mark taken in app',c,52,8,'center');break;
  case'taken':T('Dose taken',c,8,10,'center');T(d.med||'',c,26,9,'center');for(let i=0;i<4;i++)x.fillRect(52+i*2,46+i*2,3,3);for(let i=0;i<6;i++)x.fillRect(60+i*2,52-i*2,3,3);break;
  case'missed':T('Missed dose',c,8,10,'center');T(d.med||'',c,28,10,'center');T(d.time||'',c,46,9,'center');break;
  case'loading':T('LOAD SLOT '+d.slot,c,6,10,'center');T(d.med||'',c,26,10,'center');T('Tap Done in app',c,48,8,'center');break;
  case'moving':T('Moving disc',c,14,11,'center');T('to slot '+d.slot,c,36,11,'center');break;
  case'message':(d.lines||[]).slice(0,3).forEach((l,i)=>T(l,c,6+i*18,10,'center'));break;
  case'error':T('Device error',c,6,11,'center');T(d.code||'',c,28,10,'center');T(d.hint||'',c,46,8,'center');break;
  case'wifi':T('Connecting WiFi...',c,16,9,'center');T('Open setup page',c,38,8,'center');break}}
 }
function paintOled(){const cv=document.getElementById('oled');if(!cv)return;prev==='live'?renderOled(cv,S.screen.name,S.screen.data):renderOled(cv,prev,sample(prev))}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const medAt=n=>{const s=S.slots[n-1];return s&&S.meds.find(m=>m.id===s.med)};
const cap=c=>`<svg class="cap" viewBox="0 0 28 14" aria-hidden="true"><rect width="28" height="14" rx="7" fill="${c}"/><path d="M14 0h7a7 7 0 0 1 0 14h-7z" fill="#fff" fill-opacity=".8"/></svg>`;
const stb=s=>`<span class="b ${s}">${ic(ST[s][0],14)} ${ST[s][1]}</span>`;
const fmt=t=>{if(S.dev.h24)return t;const[h,m]=t.split(':').map(Number);return((h+11)%12+1)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')};
const busy=t=>S.log.some(c=>c.status==='pending'&&c.type===t)?'disabled':'';
function toast(m,u){const e=document.createElement('div');e.textContent=m;if(u){const b=document.createElement('button');b.textContent='Undo';b.className='sm';b.onclick=()=>{u();e.remove()};e.append(b)}const tc=document.getElementById('toast');tc.append(e);while(tc.children.length>2)tc.firstChild.remove();setTimeout(()=>e.remove(),u?6000:3500)}
function dlg(html){const w=document.getElementById('dlgw');document.getElementById('dlg').innerHTML='<button class="sm" data-a="x" aria-label="Close dialog" style="float:right">Close</button>'+html;w.classList.add('open');const f=w.querySelector('input,select,#dlg button:not([aria-label="Close dialog"])');f&&f.focus()}

document.addEventListener('keydown',e=>{const w=document.getElementById('dlgw');if(!w.classList.contains('open'))return;if(e.key==='Escape')closeDlg();if(e.key==='Tab'){const f=[...w.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});

function pgDash(){const n=nowTz(),dues=S.doses.filter(d=>d.status==='due'),cur=dues[0],nx=S.doses.find(d=>d.status==='upcoming'||d.status==='snoozed'),m=cur&&medAt(cur.slot),nm=nx&&medAt(nx.slot);
 const wk=S.hist.filter(h=>Date.now()-new Date(h.date)<8*864e5),ad=wk.length?Math.round(100*wk.filter(h=>h.status==='taken').length/wk.length):100;
 const low=S.slots.filter(s=>s.med&&s.left<=S.dev.low).length,tk=S.doses.filter(d=>d.status==='taken').length;
 let cd='';if(nx){const k=(nx.status==='snoozed'?nx.until:toMin(nx.time))-n.min;cd=k>0?'in '+(k>=60?Math.floor(k/60)+'h ':'')+k%60+'m':'now'}

 :cur?`<div class="card alarm hero" role="alert"><div class="row">${ic('bell',22)}<h3 style="margin:0">Dose due now</h3></div><p class="big">${m?cap(m.color)+esc(m.name):''} <span class="mut">${m?esc(m.dose):''}</span></p><p>Slot ${cur.slot} &middot; ${cur.qty} pill${cur.qty>1?'s':''} &middot; ${hint}${dues.length>1?' &middot; '+(dues.length-1)+' more queued':''}</p><div class="row"><button class="p big" data-a="take" data-id="${cur.id}">${ic('check',20)} Mark as taken</button><button data-a="snooze" data-id="${cur.id}">${ic('snooze',16)} Snooze ${S.dev.snooze} min</button><button data-a="skip" data-id="${cur.id}">${ic('skip',16)} Skip</button></div></div>`
 :nx&&nm?`<div class="card hero"><h3>Next dose</h3><p class="big">${cap(nm.color)}${esc(nm.name)} <span class="mut">${esc(nm.dose)}</span></p><p class="mut">Slot ${nx.slot} &middot; ${fmt(nx.time)} &middot; <b>${cd}</b></p><div class="row"><button data-a="rotn" data-n="${nx.slot}" ${busy('rotate')}>${ic('rot',16)} Rotate to slot ${nx.slot}</button></div></div>`
 :`<div class="card hero">${ic('check',22)}<h3>All done for today</h3><p class="mut">No more doses scheduled today.</p></div>`;
 const rows=S.doses.map(d=>{const mm=medAt(d.slot);return`<div class="tli ${d.status}"><span><b class="mono">${fmt(d.time)}</b> ${mm?cap(mm.color)+esc(mm.name):'?'} <span class="mut">Slot ${d.slot}</span></span><span>${d.status==='due'&&dues.indexOf(d)>0?'<span class="b upcoming">Queued</span>':stb(d.status)}</span></div>`}).join('');
 const log=S.log.map(c=>`<div class="row sp"><span>${c.t} ${c.type}</span><span class="b ${c.status==='failed'?'missed':c.status==='pending'?'due':'taken'}">${c.status}</span><span class="mut">${esc(c.res)}</span>${c.status==='failed'?`<button class="sm" data-a="retry" data-id="${c.id}">Retry</button>`:''}</div>`).join('')||'<p class="mut">No commands yet.</p>';
 return`<h2>Today</h2><div class="dash"><div class="col">${hero}<div class="card"><div class="row sp"><h3>Today's doses</h3><span class="mut">${tk} of ${S.doses.length} taken</span></div>${rows||'<p class="mut">No doses scheduled today.</p>'}</div><div class="card"><div class="stats"><div><b class="mono">${ad}%</b>Adherence</div><div><b class="mono">${tk}</b>Taken today</div><div class="${low?'warn':''}"><b class="mono">${low}</b>${ic(low?'warn':'check',14)} Low stock</div></div></div></div>

 csv(){const r=['date,time,medicine,status,via',...filtHist().map(h=>[h.date,h.time,h.med,h.status,h.via].join(','))].join('\n');view.hold=1;dlg(`<h3>CSV export</h3><textarea id="csvt" rows="8" readonly>${esc(r)}</textarea><div class="row" style="margin-top:12px"><a download="sagebot-history.csv" href="data:text/csv;charset=utf-8,${encodeURIComponent(r)}"><button class="p" tabindex="-1">Download</button></a><button data-a="x">Close</button></div>`)},
 demo(){S=base();demo();ensureDay();api.save();render();toast('Demo data loaded')},clear(){const t=S.theme;S=base();S.theme=t;ensureDay();api.save();render();toast('Data cleared')},reset(){if(confirm('Reset everything?'))A.demo()}};
function addFlow(n,step,m){const e=document.getElementById('dlg');
 if(step===1){dlg(`<h3>Slot ${n}</h3>${S.hw.stepper?'':'<p class="mint card">Stepper is off: place the medicine by hand in the virtual slot.</p>'}${disc(1)}<p id="cs" style="text-align:center">Moving disc to slot ${n}...</p>`);api.sendCommand('rotate',{slot:n}).then(c=>addFlow(n,2,c))}
 else if(step===2){dlg(`<h3>Choose medicine</h3><p class="mut">Command: ${m.status}</p><label>Existing</label><select id="am"><option value="">Create new</option>${S.meds.map(x=>`<option value="${x.id}">${esc(x.name)} ${esc(x.dose)}</option>`).join('')}</select><label>Name</label><input id="an"><label>Dose</label><input id="ad" placeholder="500mg"><label>Notes</label><input id="ao"><label>Colour</label><select id="ac">${COLORS.map(c=>`<option value="${c}" style="background:${c}">${c}</option>`).join('')}</select><label>Pill count</label><input id="ap" type="number" min="1" value="20"><p id="ae" role="alert" class="mut"></p><div class="row"><button class="p" id="adn">Save</button><button data-a="x">Cancel</button></div>`);
  document.getElementById('adn').onclick=()=>{const ex=document.getElementById('am').value,nm=document.getElementById('an').value.trim(),p=+document.getElementById('ap').value;if(!ex&&!nm)return document.getElementById('ae').textContent='Name is required.';if(p<1)return document.getElementById('ae').textContent='Pill count must be 1 or more.';
   let id=+ex;if(!ex){id=Date.now();S.meds.push({id,name:nm,dose:document.getElementById('ad').value,notes:document.getElementById('ao').value,color:document.getElementById('ac').value})}
   api.saveSlot(n,{med:id,left:p}).then(()=>{setScreen('loading',{med:medAt(n).name,slot:n});addFlow(n,3)})}}
 else dlg(`<h3>Done</h3><p>${esc(medAt(n).name)} is loaded in slot ${n}.</p><button class="p" id="dd">Done</button>`),document.getElementById('dd').onclick=()=>{setScreen('home');A.x();toast('Medicine added')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,b)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='pick'){prev=t.value;paintOled();return}
 if(t.dataset.v){view[t.dataset.v]=t.value;document.activeElement.blur();render();return}
 if(t.dataset.s){const k=t.dataset.s;S.dev[k]=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;if(k==='slots')S.dev.slots=Math.min(8,Math.max(4,+t.value||8));
  if(k==='notif'&&t.checked&&window.Notification)Notification.requestPermission();if(k==='tz'||k==='h24'){S.day='';ensureDay()}api.save();t.blur();render()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pk')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.getElementById('dlgw').addEventListener('click',e=>{if(e.target.id==='dlgw')A.x()});
window.addEventListener('hashchange',()=>{view.hold=0;closeDlg();render()});
api.load();S.pos=S.pos||1;S.dev.slots=S.dev.slots||8;if(S.theme)document.documentElement.dataset.theme=S.theme;ensureDay();
setTimeout(()=>{setScreen('home');},1500);setInterval(()=>{if(S.screen.name==='home'){S.screen.data=homeData()}tick()},5000);
const LIST=['live',...SCREENS];A.knob=()=>{prev=LIST[(LIST.indexOf(prev)+1)%LIST.length];render()};
document.addEventListener('keydown',e=>{if(document.getElementById('dlgw').classList.contains('open')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const i='123456'.indexOf(e.key);if(i>=0)location.hash='#/'+NAV[i][0];else if(e.key==='t'||e.key==='T')A.theme();else if((e.key==='ArrowDown'||e.key==='ArrowUp')&&view.route==='dashboard'){e.preventDefault();prev=LIST[(LIST.indexOf(prev)+(e.key==='ArrowDown'?1:-1)+LIST.length)%LIST.length];render()}});
render();
</script></body></html>
